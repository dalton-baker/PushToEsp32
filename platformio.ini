[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Uncomment to trace every protocol byte in/out plus the raw gravity vector
    ; at 1Hz. Off by default: it logs on every poll. This is what identified the
    ; SkySafari command-burst desync and the uninitialised accelerometer.
    ; -DPUSHTO_TRACE=1

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps = 
    Wire
    adafruit/Adafruit MPU6050@^2.2.4
    adafruit/Adafruit BusIO@^1.14.1
    adafruit/Adafruit Unified Sensor@^1.1.9
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    h2zero/NimBLE-Arduino@^1.4.3

; Partitions: no filesystem image is used, the firmware serves no files.
board_build.partitions = default.csv

; Upload settings
upload_speed = 921600
